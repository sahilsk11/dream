name = "dream"
main = "worker/index.ts"
compatibility_date = "2026-10-18"
account_id = "0aac5310338965632a15a7a52173813a"
# Off so there is no public workers.dev backdoor around Access.
workers_dev = false
upload_source_maps = true

# dream.ultron.sh — Workers custom domain. Cloudflare will create DNS on
# the ultron.sh zone when this is first deployed. If Terraform already
# owns DNS (same pattern as bs.ultron.sh), add an AAAA 100:: placeholder
# named "dream" in sahilsk11/cloudflare first, then deploy.
[[routes]]
pattern = "dream.ultron.sh"
custom_domain = true
zone_name = "ultron.sh"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "dream"
database_id = "f5d906b7-b6a7-43d3-a36e-7e7bcb7e7395"
migrations_dir = "migrations"

[vars]
DREAM_TZ = "America/New_York"
ALLOW_SEED = "false"
# Browser auth = Cloudflare Access only (no passcode). The Worker verifies
# Cf-Access-Jwt-Assertion against this team + the `dream` Access app aud and
# admits only these emails. Agents still need Bearer DREAM_API_TOKEN (their
# service-token JWT has no email).
ACCESS_TEAM_DOMAIN = "sahilagentserver.cloudflareaccess.com"
ACCESS_AUD = "00b25b7d166b53ff5cb3f4bb41b7d9e32420023a2d38c96cb0bd6c5d5245b843"
ACCESS_ALLOWED_EMAILS = "sahilkapur.a@gmail.com"

[observability]
enabled = true

[dev]
port = 8787
